[project]
name = "extractor-estado-tributario"
version = "0.1.0"
description = "API FastAPI + Playwright para consultar el Estado Tributario del SRI Ecuador."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "lxml>=5.3.0",
  "playwright>=1.48.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

