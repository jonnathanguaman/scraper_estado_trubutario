services:
  extractor-estado-tributario:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extractor-estado-tributario
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      SRI_HEADLESS: "true"
      SRI_TIMEOUT_MS: "${SRI_TIMEOUT_MS:-60000}"
      SRI_PROFILE_DIR: "/app/storage/browser-profile"
      SRI_RATE_LIMIT_SECONDS: "${SRI_RATE_LIMIT_SECONDS:-5}"
      SRI_SCREENSHOT_DIR: "/app/storage/screenshots"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./storage:/app/storage
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
